spring.application.name=library-management-system

spring.datasource.url=jdbc:h2:file:/var/data/librarydb_final;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

server.port=${PORT:8081}

app.jwt.secret=${APP_JWT_SECRET:LibraryManagementSystemSuperSecretKeyForJWTTokenGeneration2024!}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

logging.level.com.library=INFO